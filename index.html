<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MyPortfolio🥀</title>
    <style>
      :root{--fg:#fff;--muted:rgba(255,255,255,.72);--accent:#e8b48a; --blobp:#B87333;}
      *{box-sizing:border-box;margin:0}
      html,body{height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:"Noto Sans Thai","Segoe UI",system-ui,sans-serif}

      #stage{position:absolute;left:50%;top:50%;overflow:hidden;transform-origin:0 0}

      .bg{position:absolute;inset:0;will-change:transform,opacity;transform-origin:50% 50%}
      .page{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:18px 123px;pointer-events:none}
      .page.top{padding-top:70px;padding-right:200px}
      .page.shift .txt{margin-top:60px;margin-right:200px}
      .txt{width:calc(560px/var(--k,1));will-change:transform,opacity}
      .txt small{letter-spacing:.2em;color:var(--muted);font-size:13px}
      .txt h1{font-size:60px;line-height:1.1;margin:10px 0 4px}
      .txt h2{font-size:20px;font-weight:500;color:var(--accent);margin-bottom:14px}
      .txt p,.txt li{color:var(--muted);line-height:1.6;font-size:15px}
      .txt ul{padding-left:1.1em}
      .txt:has(.sop){width:calc(900px/var(--k,1))}
      .txt{-webkit-text-stroke:2px #000;paint-order:stroke fill}
      .sop p{font-size:18px;line-height:1.5;text-align:justify;text-indent:2em;margin-bottom:.5em}
      .sec{margin-top:10px}
      .sec h3{display:inline-block;font-size:17px;color:var(--accent);border-bottom:1px solid var(--accent);margin-bottom:4px}
      .row{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--accent)}
      .row b{font-size:30px;color:var(--accent)}
      .row em{font-style:normal;color:var(--accent);font-size:13px;display:block}
      .row strong{display:block;font-size:18px}
      .big{font-size:48px;font-weight:700;margin-top:18px}
      .by{margin-top:16px}
      .by strong{display:block;font-size:26px}
      .cap{border-top:1px solid var(--muted);border-bottom:1px solid var(--muted);padding:6px 0;margin-top:10px}
      .cap b{display:block;font-size:15px}
      #imgwrap{position:absolute;inset:0;z-index:150;display:flex;align-items:center;justify-content:flex-start;padding:0 15px 0;pointer-events:none}

      #vid{pointer-events:auto;cursor:pointer;}
      #vid{width:auto;height:30%;margin-top:150px;margin-left:300px}
      #vid{border-radius:16px}

      #yt{width:507px;height:285px;border:0;border-radius:16px;margin-top:150px;margin-left:300px;pointer-events:auto}

      #playbtn{position:absolute;left:25%;top:45%;transform:translate(-25%,-25%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:32px;cursor:pointer;pointer-events:auto;transition:.3s}
      #playbtn.off{opacity:0;pointer-events:none}
      #playbtn{padding:0 0 45px 6px}
      .img{width:950px;aspect-ratio:1;overflow:hidden;}
      .img img{width:100%;height:auto;object-fit:cover;display:block;transform:scaleX(-1)}
      .img{margin-top:300px}
      .img{margin-left:-155px}
      .img{clip-path:inset(0 0 0 27%)}
      .extra{position:absolute;z-index:140;pointer-events:none;will-change:transform,opacity}
      .extra img{display:block;width:10%;height:auto;}

      #dots{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:200}
      #dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
      #dots i.on{background:#fff;transform:scale(1.5)}
      #count{position:absolute;left:24px;bottom:24px;z-index:200;font-size:14px;letter-spacing:.15em;color:var(--muted)}
      .sop-prev{pointer-events:auto;cursor:zoom-in;margin-top:10px}
      .sop p{text-align:left;word-break:normal;line-break:strict}
      .sop-prev span{display:inline-block;margin-top:10px;color:var(--accent);border-bottom:1px solid var(--accent);font-size:14px}
      .sop-prev h2{font-size:28px;margin-top:10px}
      .sop-prev h2{display:inline-block;font-size:26px;margin-top:10px;color:var(--accent);border-bottom:2px solid var(--accent)}
      #sopov{position:absolute;inset:0;z-index:300;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.35s}
      #sopov.on{opacity:1;visibility:visible}
      #sopov .box{position:relative;width:900px;max-height:743px;overflow-y:auto;padding:32px;transform:scale(.9);transition:.35s}
      #sopov.on .box{transform:scale(1)}
      #sopov .sop p{font-size:19px;line-height:1.7}
      #sopx{position:absolute;top:20px;right:24px;font-size:28px;background:none;border:0;color:#fff;cursor:pointer}
      #hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;font-size:13px;letter-spacing:.15em;color:var(--muted);}
      #hint.off{opacity:0}

      #nav{position:absolute;top:0px;left:50%;transform:translateX(-50%);z-index:200;display:flex;gap:6px;padding:6px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);pointer-events:auto}
      #nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;letter-spacing:.12em;padding:10px 48px;cursor:pointer;transition:.3s}
      #nav button:hover{color:#fff}
      #nav button.on{background:var(--accent);color:#000}

      .card{width:340px}
      .card img{width:100%;height:190px;object-fit:contain;object-position:left center;display:block}
      .ecap{margin-top:8px;-webkit-text-stroke:2px #000;paint-order:stroke fill}
      .ecap b{display:block;font-size:13px;color:var(--fg)}
      .ecap p{color:var(--muted);font-size:14px;line-height:1.5}
      .page.activ .ecap b{font-size:16px}
      
      .card.side{width:auto;display:flex;align-items:center;gap:24px}
      .card.side img{width:300px;height:170px;flex:none}
      .card.side .ecap{width:440px;margin-top:0}

      .page.certi{justify-content:flex-start;padding:68px 130px 0}
      .page.certi .txt{margin:0;width:auto}
      .page.certi .txt h1{font-size:44px}

      .page.activ{justify-content:flex-start;padding:0 0 0 130px}
      .page.activ .txt{margin:0;width:380px}

      .ghlink{display:inline-block;margin-top:14px;color:var(--accent);border-bottom:1px solid var(--accent);font-size:16px;text-decoration:none;pointer-events:auto;cursor:pointer}
      .ghlink:hover{color:#fff;border-color:#fff}

      .viewimg{display:inline-block;margin-top:14px;color:var(--accent);border-bottom:1px solid var(--accent);font-size:32px;pointer-events:auto;cursor:zoom-in}
      .viewimg:hover{color:#fff;border-color:#fff}
      #lbbox{display:flex;gap:20px;width:92%;height:88%;align-items:center;justify-content:center}
      #lbbox img{flex:1 1 0;min-width:0;max-width:100%;max-height:100%;object-fit:contain}

      /* click to zoom */
      .card{pointer-events:auto;cursor:zoom-in}
      #lb{position:absolute;inset:0;z-index:400;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.35s;cursor:zoom-out}
      #lb.on{opacity:1;visibility:visible}
      #lb img{max-width:90%;max-height:90%;object-fit:contain;transform:scale(.85);transition:.35s}
      #lb.on img{transform:scale(1)}
      #lbhint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.15em;color:var(--muted);pointer-events:none}
    </style>

  </head>
  <body>
    <div id="stage">
      <div id="imgwrap"><div class="img"><img id="main" alt="placeholder"><video id="vid" playsinline preload="metadata" style="display:none"></video><iframe id="yt" style="display:none" src="about:blank" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe><button id="playbtn" style="display:none">▶</button></div></div>
      <div id="dots"></div>
      <div id="nav"></div>
      <div id="count"></div>
      <div id="hint">เลื่อนเมาส์ เพื่อดูหน้าถัดไป ↓</div>
      <div id="sopov"><button id="sopx">✕</button><div class="box"><h1 id="sopt">STATEMENT OF PURPOSE</h1><div class="sop"></div></div></div>
      <div id="lb"><div id="lbbox"></div><span id="lbhint">click anywhere to close</span></div>
    </div>
    <script>
      const K=3; // frames

      const sec=(t,items)=>`<div class="sec"><h3>${t}</h3><ul style="list-style:none;padding:0">${items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
      const row=(y,lv,sch,extra)=>`<div class="row"><b>${y}</b><div><em>${lv}</em><strong>${sch}</strong><p>${extra}</p></div></div>`;
      const cap=(t,s)=>`<div class="cap"><b>${t}</b><p>${s}</p></div>`;
      const lorem='deep breath deep breath deep breath deep breath deep breath deep breath deep breath.';
      const sop=[
          `ผมเริ่มสนใจการเขียนโปรแกรมจากความสงสัยว่า คำสั่งที่เขียนขึ้นสามารถกลายเป็นเกมที่ผมเล่นได้อย่างไร เมื่อได้ลองเขียนโปรแกรมด้วยตัวเอง ผมพบว่าการทำให้เกมทำงานไม่ได้มีเพียงการเขียนคำสั่ง แต่ยังต้องเข้าใจว่าควรให้แต่ละส่วนทำงานอย่างไรและทำงานร่วมกันอย่างไร ทำให้ผมเริ่มตั้งคำถามต่อจาก “เขียนอย่างไร” ไปสู่ “ทำไมมันจึงทำงานเช่นนั้น”`,
          `ผมจึงลองพัฒนาเกม 2D ด้วยภาษา C# และ MonoGame โดยไม่ใช้ Game Engine เพราะต้องการทำความเข้าใจกลไกพื้นฐานของเกมด้วยตัวเอง ระหว่างการพัฒนา ผมได้พบกับปัญหาตั้งแต่การควบคุมตัวละคร การตรวจสอบการชน ระบบศัตรู ไปจนถึงการจัดการสถานะและข้อผิดพลาดของเกม`,
          `การพัฒนาโปรเจกต์ด้วยตัวเองทำให้ผมพบว่าการสร้างซอฟต์แวร์จริงนั้นยากกว่าที่คิด ทั้งในด้านจำนวนปัญหาและเวลาที่ต้องใช้ ผมได้นำ AI มาใช้เป็นเครื่องมือช่วยค้นหาข้อมูล อธิบายแนวคิด เสนอแนวทางแก้ไขปัญหาที่พบในการเขียนโปรแกรม แต่ยิ่งใช้มากขึ้น ผมกลับยิ่งเห็นว่าการเข้าใจโค้ดและตัดสินใจด้วยตัวเองยังเป็นสิ่งสำคัญ ผมพบว่าคำตอบจาก AI ไม่ได้ถูกต้องหรือเหมาะสมกับทุกสถานการณ์เสมอไป ผมจำเป็นต้องทดลอง ตรวจสอบ และปรับแก้ก่อนนำมาใช้ ประสบการณ์นี้ทำให้ผมเห็นว่า AI สามารถเป็นเครื่องมือที่ช่วยเพิ่มประสิทธิภาพในการพัฒนาซอฟต์แวร์ได้ แต่ผู้พัฒนายังคงต้องมีความรู้พื้นฐานเพียงพอที่จะประเมินผลลัพธ์และตัดสินใจด้วยตัวเอง ประสบการณ์นี้ทำให้ผมสนใจการใช้เทคโนโลยีใหม่อย่างมีวิจารณญาณ รวมถึงการสร้างความรู้พื้นฐานที่ช่วยให้ผมตรวจสอบและประเมินสิ่งที่เทคโนโลยีสร้างขึ้นได้`,
          `นอกจากการเรียนรู้ด้วยตัวเองแล้ว ผมยังมีโอกาสเข้าร่วมหลักสูตร Interactive Web and Front-End Development และ Back-End Development ซึ่งดำเนินการโดยวิทยาลัยศิลปะ สื่อ และเทคโนโลยี มหาวิทยาลัยเชียงใหม่ รวมถึงการแข่งขันหุ่นยนต์ KTIS CPU 3rd ASEAN GRAND PRIX YOUTH ROBOTICS & ESPORTS COMPETITION 2025 ซึ่งผมได้รับรางวัลระดับเหรียญเงิน ประสบการณ์เหล่านี้ทำให้ผมได้เห็นการนำความรู้ด้านเทคโนโลยีไปประยุกต์ใช้ในรูปแบบที่แตกต่างกัน ตั้งแต่การพัฒนาเว็บไซต์ไปจนถึงการควบคุมหุ่นยนต์ และทำให้ผมเห็นว่าการสร้างระบบที่ทำงานได้จริงต้องอาศัยทั้งการออกแบบ การทดลอง และการแก้ปัญหาอย่างเป็นขั้นตอน`,
          `สิ่งที่ผมได้เรียนรู้จากการพัฒนาโปรเจกต์ไม่ใช่เพียงการเขียนโค้ด แต่ยังรวมถึงวิธีมองปัญหา เมื่อระบบทำงานผิด ผมพบว่าการเพิ่มโค้ดเข้าไปเรื่อย ๆ ไม่ได้ช่วยแก้ปัญหาเสมอไป ผมต้องย้อนกลับมาพิจารณาโครงสร้างของระบบว่าแต่ละส่วนควรรับผิดชอบอะไรและควรทำงานร่วมกันอย่างไร ประสบการณ์นี้ทำให้ผมเริ่มสนใจการออกแบบซอฟต์แวร์และการแก้ปัญหาอย่างเป็นระบบมากขึ้น และเมื่อมองย้อนกลับไป ทั้งการพัฒนาเว็บ เกม และหุ่นยนต์ดูต่างกัน แต่มีจุดร่วมเดียวกัน คือการใช้เทคโนโลยีสร้างสิ่งใหม่หรือแก้ปัญหาให้ดีขึ้น ผมมองว่าความเข้าใจพื้นฐานเหล่านี้ยังสำคัญต่อการนำ AI มาใช้ร่วมกับซอฟต์แวร์ เพราะการสร้างระบบที่ดีไม่ได้ขึ้นอยู่กับเทคโนโลยีเพียงอย่างเดียว แต่ต้องเข้าใจวิธีนำเทคโนโลยีนั้นมาใช้ให้เหมาะสมกับปัญหาด้วย`,
          `ผมจึงต้องการศึกษาต่อในสาขาวิชาวิศวกรรมซอฟต์แวร์ วิทยาลัยศิลปะ สื่อ และเทคโนโลยี มหาวิทยาลัยเชียงใหม่ เพื่อต่อยอดสิ่งที่ผมเรียนรู้ด้วยตัวเองให้เป็นพื้นฐานที่แข็งแรงขึ้น ผมสนใจแนวทางการเรียนแบบเน้นการลงมือทำของหลักสูตร เพราะอยากนำสิ่งที่เรียนไปทดลองกับปัญหาจริง เหมือนที่ผมเคยเรียนรู้ผ่านการพัฒนาเกมด้วยตัวเอง แต่ในครั้งนี้ผมอยากเข้าใจการออกแบบระบบ การทดสอบ และกระบวนการพัฒนาซอฟต์แวร์อย่างเป็นระบบมากขึ้น นอกจากนี้ หลักสูตรยังมีสหกิจศึกษาซึ่งช่วยให้ผมได้ลงมือทำงานในสภาพแวดล้อมจริงก่อนจบ ผมหวังว่าจะนำสิ่งเหล่านี้ไปสร้างซอฟต์แวร์ที่ใช้งานได้จริง และเตรียมพร้อมสำหรับการทำงานด้านซอฟต์แวร์ในอนาคต`,
          `แม้ผมยังมีอีกหลายอย่างที่ต้องเรียนรู้ แต่การสร้างโปรเจกต์ด้วยตัวเองทำให้ผมรู้ว่าผมชอบกระบวนการนี้จริง ๆ ผมชอบการพบปัญหาที่ยังไม่มีคำตอบสำหรับตัวเอง ค่อย ๆ แยกปัญหาออกเป็นส่วน ทดลองและแก้ไข จนเข้าใจว่าทำไมระบบจึงทำงานได้ ซึ่งเป็นคำถามเดียวกับที่ทำให้ผมเริ่มต้นสนใจการเขียนโปรแกรม`,
          `ผมต้องการนำความสงสัยและวิธีคิดนี้ไปต่อยอดในการศึกษาระดับมหาวิทยาลัย เพื่อพัฒนาตัวเองให้สามารถออกแบบและสร้างซอฟต์แวร์ที่แก้ปัญหาได้จริง พร้อมทั้งทำความเข้าใจและประยุกต์ใช้เทคโนโลยีใหม่ ๆ ได้อย่างมีประสิทธิภาพ`
      ];

      const LilyValley=['LillyValley เป็นโปรเจกต์เกม 2D Pixel Art ที่พัฒนาด้วยภาษา C# และ MonoGame โดยไม่ใช้ Game Engine สำเร็จรูป มีจุดประสงค์เพื่อศึกษาและทดลองสร้างระบบพื้นฐานของเกมด้วยตนเอง ตั้งแต่การควบคุมตัวละคร การตรวจจับการชน ไปจนถึงระบบศัตรูและการจัดการสถานะของเกม',
        'นอกจากการพัฒนาระบบแต่ละส่วนแล้ว ผมยังให้ความสำคัญกับการออกแบบโครงสร้างโปรแกรมและการแยกหน้าที่ของแต่ละระบบ เพื่อให้สามารถทำงานร่วมกันได้อย่างเป็นระเบียบและต่อยอดได้ง่ายขึ้น',
        '','•••สิ่งที่พัฒนาในโปรเจกต์',
        '•ระบบควบคุมตัวละคร การเคลื่อนที่ และการกระโดด',
        '•ระบบตรวจจับและจัดการการชน',
        '•ศัตรูที่มีพฤติกรรมแตกต่างกัน',
        '•ระบบ Animation และการจัดการสถานะของเกม',
        '•ระบบ Dialogue และ Cutscene ที่สามารถนำกลับมาใช้ซ้ำได้',

      function fit(){
        const lim=H*.98;
        pages.forEach(o=>{
          let k=1;const t=o.txt;
          t.style.setProperty('--k',k);t.style.zoom=k;
          while(t.getBoundingClientRect().height/S>lim&&k>1){
            k=Math.max(.35,k-.03);t.style.setProperty('--k',k);t.style.zoom=k;
          }
        });
      }
      fit();
      addEventListener('resize',()=>{scaleStage();fit();});
      if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

      const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
      let cur=0,target=0,base=0,moved=false,curFrame=-1;
      let settled=0,lockUntil=0,jump=false;
      const COOLDOWN=100;
      const LAST=(data.length-1)*K;

      function render(){
        pages.forEach((o,i)=>{
          const d=cur-i,a=Math.abs(d);
          o.bg.style.visibility=(d>=0&&d<0.5)||(d<0&&d>-0.5)?'visible':'hidden';
          o.bg.style.opacity=1;
          o.bg.style.transform='none';
          const vis=a<1;
          o.pg.style.visibility=vis?'visible':'hidden';
          if(!vis)return;
          o.txt.style.opacity=clamp(1-a*2);
          o.txt.style.transform=`translateY(${-d*45}px)`;
          o.ex.forEach(el=>{
            el.style.opacity=clamp(1-a*2);
            el.style.transform=`translateY(${-d*45}px)`;
          });
        });
        const g=clamp(Math.round(cur*K),0,LAST);
        if(g!==curFrame){
          curFrame=g;
          const i=Math.floor(g/K),k=g%K;
          const key=`${i+1}.${k+1}`;

          // YouTube
          if(useYT){

              yt.src=`https://www.youtube.com/embed/${ytIds[key]}?rel=0`;

          }else{
            if(yt.dataset.id){yt.src='about:blank';yt.dataset.id='';} // หยุดเสียงเมื่อออกจากหน้า
            yt.style.display='none';

          // วิดีโอไฟล์ .mp4
          if(useVid){
            vid.style.display='block';

            playbtn.classList.remove('off');
            vid.src=vsrc(i,k);
          }else{
            vid.pause();
            vid.style.display='none';
            playbtn.style.display='none';
          }

          // รูป
          if(useYT||useVid||i>=5){
            main.style.display='none';
          }else{
            main.style.display='block';
            main.src=frames[g];
          }
        }
        const n=Math.round(cur);
        document.getElementById('hint').classList.toggle('off',n>0);
        [...dots.children].forEach((e,i)=>e.classList.toggle('on',i===n));
        count.textContent=String(n+1).padStart(2,'0')+' / '+String(data.length).padStart(2,'0');
      }
      function loop(){
        const prev=cur;
        cur+=(target-cur)*.04;if(Math.abs(target-cur)<.0005)cur=target;
        const n=Math.round(cur),lo=Math.min(prev,cur),hi=Math.max(prev,cur);
        if(n!==settled&&n>=lo-1e-3&&n<=hi+1e-3&&(!jump||cur===target)){
          settled=n;jump=false;target=n;lockUntil=performance.now()+COOLDOWN;
        }
        render();requestAnimationFrame(loop);
      }
      function nudge(delta){
        if(performance.now()<lockUntil)return;
        target=clamp(target+delta,0,data.length-1);
        moved=true;
      }
      const ov=document.getElementById('sopov');

        sop:{t:'STATEMENT OF PURPOSE',a:sop},
        proj:{t:'LILLYVALLEY',a:LilyValley}
      };

        if(t.startsWith('•••'))return `<h3 style="color:var(--accent);margin:6px 0 4px">${t.slice(3)}</h3>`;
        if(t.startsWith('•'))return `<p style="text-indent:0;padding-left:1.2em">${t}</p>`;
        return `<p>${t}</p>`;
      }).join('');
      let sopOpen=false;
      function openSop(key='sop'){
        document.getElementById('sopt').textContent=docs[key].t;
        ov.querySelector('.sop').innerHTML=renderDoc(docs[key].a);
        sopOpen=true;ov.classList.add('on');ov.querySelector('.box').scrollTop=0;
      }
      function closeSop(){sopOpen=false;ov.classList.remove('on');}
      ov.onclick=e=>{if(e.target===ov||e.target.id==='sopx')closeSop();};

      // ซูมรูป
      const lb=document.getElementById('lb'),lbbox=document.getElementById('lbbox');
      let lbOpen=false;
      function openLb(src){
        const a=Array.isArray(src)?src:[src];
        lbbox.innerHTML=a.map(s=>`<img src="${s}" alt="">`).join('');
        lbOpen=true;lb.classList.add('on');
      }
      function closeLb(){lbOpen=false;lb.classList.remove('on');}
      lb.onclick=closeLb;

      addEventListener('wheel',e=>{
        if(sopOpen||lbOpen)return;
        e.preventDefault();
        if(Math.abs(e.deltaY)<4)return;
        goto(Math.round(target)+(e.deltaY>0?1:-1));
      },{passive:false});
      addEventListener('keydown',e=>{
        if(lbOpen){if(e.key==='Escape')closeLb();return;}
        if(sopOpen){if(e.key==='Escape')closeSop();return;}
        if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();goto(Math.round(target)+1);}
        if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();goto(Math.round(target)-1);}
      });
      function goto(n){
        if(performance.now()<lockUntil||Math.abs(target-cur)>.001)return;
        target=clamp(Math.round(n),0,data.length-1);base=target;jump=target!==settled;moved=true;
      }
      let ty=null;
      addEventListener('touchstart',e=>{ty=e.touches[0].clientY;},{passive:true});
      addEventListener('touchmove',e=>{
        if(sopOpen||lbOpen)return;
        if(ty===null)return;
        const dy=ty-e.touches[0].clientY;
        if(Math.abs(dy)>30){goto(Math.round(target)+(dy>0?1:-1));ty=null;}
      },{passive:true});
      addEventListener('touchend',()=>{ty=null;});
      [...dots.children].forEach((e,i)=>{e.style.cursor='pointer';e.onclick=()=>goto(i);});
      dots.style.pointerEvents='auto';
      loop();
    </script>
